name: SManMixerFX
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  SManMixerFX:
    type: application
    platform: iOS
    sources:
      - App.swift
      - ContentView.swift
      - DSP.swift
      - DarbukaEngine.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: S-Man Mixer FX
        CFBundleName: S-Man Mixer FX
        NSMicrophoneUsageDescription: Microphone access is required for S-Man Mixer FX live audio processing.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sman.mixerfx
        PRODUCT_NAME: SManMixerFX
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
