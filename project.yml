name: DarbukaFX
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  DarbukaFX:
    type: application
    platform: iOS
    sources:
      - App.swift
      - ContentView.swift
      - DSP.swift
      - DarbukaEngine.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Darbuka FX
        NSMicrophoneUsageDescription: Microphone access is required to process darbuka audio.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darbukafx.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
