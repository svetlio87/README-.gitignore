name: SManMixerFX
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  SManMixerFX:
    type: application
    platform: iOS
    sources:
      - App.swift
      - ContentView.swift
      - DSP.swift
      - DarbukaEngine.swift
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: S-Man Mix Fx
        CFBundleName: S-Man Mix Fx
        NSMicrophoneUsageDescription: Microphone access is required for S-Man Mix Fx live audio processing.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sman.mixerfx
        PRODUCT_NAME: SManMixerFX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
