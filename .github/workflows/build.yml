name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SManMixerFX.xcodeproj \
            -scheme SManMixerFX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload SManMixerFX.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SManMixerFX.app Payload/
          zip -qry SManMixerFX.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SManMixerFX-ipa
          path: SManMixerFX.ipa
